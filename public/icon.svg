<!-- The logo as drawn, and the master everything else comes out of. It arrives
     as a finished tile - the gradient square, the dark panel inset in it, and
     the keys - rather than as the mark alone, so nothing here is composed and
     the paths are the export verbatim.

     public/icon.svg and public/logo.svg are copies of this file, made by
     tools/make-icons.ts, and every PNG in public/ is baked from it.
     public/patchmemory.svg stands it over the wordmark. icon-maskable.svg
     beside it is the only drawing that departs from it.

     The tile goes with it everywhere, a page as much as a launcher: it is what
     the gaps between the keys are drawn against, and a mark that borrowed a
     backdrop for them would be one mark on a dark page and another on a light
     one.

     It is drawn square to the edge and the corner is left to whoever renders
     it: a browser tab, a bookmark and a launcher each cut their own, and a
     radius baked in here would sit inside theirs as a second, wrong one. -->
