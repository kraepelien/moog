name: Deploy (Docker / NAS)

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SSH_USER: peter
  SSH_HOST: ts.pomello.se
  SSH_PORT: 1492

jobs:
  # The image is only built from a green tree. The editor is small enough that
  # this costs a minute and saves deploying something that does not typecheck.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The id the container runs as has to match whoever owns the share, or
          # every file it writes comes back unreadable from the NAS. Set these as
          # repository variables once the share's owner is known.
          build-args: |
            UID=${{ vars.MOOG_UID || '1000' }}
            GID=${{ vars.MOOG_GID || '1000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # No red/green. The editor holds no session and one writer owns the data
      # folder, so two containers overlapping on it is the thing worth avoiding,
      # not the couple of seconds between them.
      - name: Deploy via SSH
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -p ${{ env.SSH_PORT }} \
              ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
              "bash /volume1/docker/moog/deploy.sh ${{ env.IMAGE }}:${{ env.SHORT_SHA }}"
