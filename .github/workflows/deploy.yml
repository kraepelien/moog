name: Deploy (Docker / NAS)

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SSH_USER: peter
  SSH_HOST: ts.pomello.se
  SSH_PORT: 1492

jobs:
  # The image is only built from a green tree. The editor is small enough that
  # this costs a minute and saves deploying something that does not typecheck.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Built into the runner's own daemon first so the next step can start it.
      # The push below is the same build again and comes back off this cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: patchmemory:smoke
          # The id the container runs as has to match whoever owns the share, or
          # every file it writes comes back unreadable from the NAS. The defaults
          # are the Synology account this deploys to; the variables only need
          # setting for a different host.
          build-args: |
            UID=${{ vars.PM_UID || '1027' }}
            GID=${{ vars.PM_GID || '65536' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `bun run build` proves the tree compiles; nothing before this proves the
      # image it goes into can boot. The server runs unbundled, so a file left
      # out of the runtime stage fails here and nowhere earlier — which is how
      # every image between the SQLite store and #34 reached the NAS dead. No
      # volume: the image makes its own /data, so this also fails if that stops
      # being true.
      - name: Smoke-test the image
        run: |
          docker run -d --name patchmemory-smoke -p 8080:8080 patchmemory:smoke
          for _ in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' patchmemory-smoke)" != running ]; then
              break
            fi
            sleep 2
          done
          echo "::error::the image never served /api/health"
          docker logs patchmemory-smoke
          exit 1

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            UID=${{ vars.PM_UID || '1027' }}
            GID=${{ vars.PM_GID || '65536' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # No red/green. The editor holds no session and one writer owns the data
      # folder, so two containers overlapping on it is the thing worth avoiding,
      # not the couple of seconds between them.
      - name: Deploy via SSH
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -p ${{ env.SSH_PORT }} \
              ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
              "bash /volume1/docker/patchmemory/deploy.sh ${{ env.IMAGE }}:${{ env.SHORT_SHA }}"
