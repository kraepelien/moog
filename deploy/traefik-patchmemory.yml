# Copied to the NAS as traefik/dynamic/patchmemory.yml — Traefik's file provider
# picks it up without a restart.
#
# The port here and PM_PORT in the deploy folder's .env are the same number in
# two places. Change one without the other and the route points at nothing.

http:
  routers:
    patchmemory:
      rule: "Host(`patchmemory.app`)"
      entryPoints:
        - websecure
      service: patchmemory

  services:
    patchmemory:
      loadBalancer:
        servers:
          - url: "http://nas-local:10072"
