<!-- The same icon for a launcher that supplies its own mask.

     Two things differ from icon.svg, and both are what "maskable" means. The
     tile has no rounded corners, because the platform cuts its own shape and a
     rounded tile under a circle leaves transparent slivers at the edge. And the
     mark is smaller — 50% of the canvas rather than 60% — so that it stays
     inside the safe zone, the centred circle of 80% diameter that is all a
     mask is guaranteed to keep. A 256 square has a half-diagonal of 181 against
     the zone's radius of 205; at 60% it would be 217 and the corners of the
     outer keys would be shaved off on a round launcher. -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keys" x1="14" y1="0" x2="14" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#81A0FF"/>
      <stop offset="0.496726" stop-color="#FFAEEF"/>
      <stop offset="1" stop-color="#FFA372"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#000000"/>

  <g transform="translate(128 128) scale(9.1428)">
    <path d="M0 4C0 1.79086 1.79086 0 4 0H6V18H8V28H4C1.79086 28 0 26.2091 0 24V4ZM12 18V0H16V18H18V28H10V18H12ZM20 28H24C26.2091 28 28 26.2091 28 24V4C28 1.79086 26.2091 0 24 0H22V18H20V28Z" fill="url(#keys)"/>
  </g>
</svg>
