<!-- The same icon for a launcher that supplies its own mask.

     One thing differs from logo.svg, and it is what "maskable" means:
     everything inside the tile is 80% of its drawn size, so it stays inside the
     safe zone - the centred circle of 80% diameter that is all a mask is
     guaranteed to keep. The panel's rounded corner reaches 241.6 units from the
     centre against the zone's radius of 204.8, so at full size a round launcher
     would shave the panel and the outer keys with it. At 0.8 it reaches 193.2.

     The tile itself is not scaled. It is the one thing that must run to the
     edge, because the platform cuts its own shape out of it and a tile inset
     from the edge would leave the mask nothing to cut. -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4171FF"/>
      <stop offset="0.496726" stop-color="#FF53DD"/>
      <stop offset="1" stop-color="#FFB650"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#tile)"/>

  <g transform="translate(51.2 51.2) scale(0.8)">
    <rect x="76" y="71" width="359" height="370" rx="40" fill="black"/>
    <path d="M331 106V296C331 298.761 328.761 301 326 301H311V406H381C392.046 406 401 397.046 401 386V126C401 114.954 392.046 106 381 106H331ZM231 106H281V296C281 298.761 283.239 301 286 301H301V406H211V301H226C228.761 301 231 298.761 231 296V106ZM111 126C111 114.954 119.954 106 131 106H181V296C181 298.761 183.239 301 186 301H201V406H131C119.954 406 111 397.046 111 386V126Z" fill="white"/>
    <path d="M201 406H131C119.954 406 111 397.046 111 386H201V406Z" fill="#8D96A1"/>
    <path d="M301 406H211V386H301V406Z" fill="#8D96A1"/>
    <path d="M311 406H381C392.046 406 401 397.046 401 386H311V406Z" fill="#8D96A1"/>
  </g>
</svg>
