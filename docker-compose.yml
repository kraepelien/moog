# Deployed the way the other containers on the NAS are: an image pulled from
# GHCR by tag, with the data on a share.
#
#   docker compose pull && docker compose up -d
#
# Traefik is not configured from here. It reads the file provider, so the route
# lives in traefik/dynamic/moog.yml and points at this published port — there are
# no labels, and no shared network to join.
#
# No red/green. The editor holds no session, so a few seconds between containers
# costs nothing, and a second copy writing the same data folder is the one thing
# worth avoiding.

services:
  moog:
    image: ${MOOG_IMAGE:-ghcr.io/kraepelien/moog:latest}
    container_name: moog
    restart: unless-stopped

    # 1027 is the Synology `docker` account; 65536 is the `docker` group, which
    # the data folder belongs to and which contains the login account too, so
    # both the container and a person can work on the same files.
    user: "${MOOG_UID:-1027}:${MOOG_GID:-65536}"

    environment:
      PORT: 8080

    # Published so Traefik can reach it by host and port, the way its dynamic
    # configuration expects. Change it here and in traefik/dynamic/moog.yml
    # together, or the route points at nothing.
    ports:
      - "${MOOG_PORT:-10072}:8080"

    volumes:
      # Everything the editor writes: the active presets and the saved patches.
      # The bank shipped in the image is copied in here the first time, and from
      # then on this folder is the truth.
      - ${MOOG_DATA_DIR:-/volume1/docker/moog/data}:/data
