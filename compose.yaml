# Deployed the way the other containers on the NAS are: an image pulled from
# GHCR by tag, routed by Traefik, with the data on a share.
#
#   docker compose pull && docker compose up -d
#
# No red/green. The editor is a single-user tool holding no session, so a few
# seconds between containers costs nothing and a second copy writing to the same
# folder is the one thing worth avoiding.

services:
  moog:
    image: ${MOOG_IMAGE:-ghcr.io/kraepelien/moog:latest}
    container_name: moog
    restart: unless-stopped

    # Must match whoever owns the share, or the files land unreadable from the
    # NAS. 1026:100 is the Synology account and its `users` group.
    user: "${MOOG_UID:-1027}:${MOOG_GID:-100}"

    environment:
      PORT: 8080

    volumes:
      # Everything the editor writes: the active presets and the saved patches.
      # The bank shipped in the image is copied in here the first time, and from
      # then on this folder is the truth.
      - ${MOOG_DATA_DIR:-/volume1/docker/moog/data}:/data

    # No ports published: Traefik reaches it on the shared network, so the only
    # way in is through the proxy.
    networks:
      - traefik

    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.moog.rule: "Host(`${MOOG_HOST:-moog.pomello.se}`)"
      traefik.http.routers.moog.entrypoints: "websecure"
      traefik.http.routers.moog.tls.certresolver: "letsencrypt"
      traefik.http.services.moog.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
